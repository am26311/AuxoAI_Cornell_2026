<!doctype html><html lang="en"><meta charset="utf-8"><title>Summit Laptops: Home</title><style>:root{--bg:#f5f1e9;--ink:#3b4a40;--head:#1f3a2b;--accent:#2e6b46;--ok:#b5651d;--line:#ddd5c4;--price:#8a3b12;--r:6px;
--screen:linear-gradient(135deg,#27402f,#7fae8e 60%,#e8efe2)}
header.brand{background:#fffdf8;border-bottom:4px solid #2e6b46}
header.brand h1{color:#1f3a2b;font-family:Georgia,"Times New Roman",serif;font-weight:700}
.mark{width:42px;height:34px;background:linear-gradient(135deg,#2e6b46 50%,#1f3a2b 50%);clip-path:polygon(0 100%,38% 18%,56% 52%,72% 30%,100% 100%);flex:none}
h2{font-family:Georgia,"Times New Roman",serif}
.card,.hero{border-radius:8px;box-shadow:none;border:2px solid var(--line)}
.hero{flex-direction:row-reverse}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
aside{background:#fff2d5;color:#5a4300;font-size:15px;font-weight:700;letter-spacing:.05em;text-align:center;padding:9px 16px;border-bottom:2px solid #f0cf86}
header.brand{display:flex;align-items:center;gap:14px;padding:16px max(30px,calc((100vw - 980px)/2 + 30px))}
header.brand h1{margin:0;font-size:30px;letter-spacing:.01em;line-height:1.1}
main{max-width:980px;margin:0 auto;padding:26px 30px 40px}
h2{font-size:34px;line-height:1.15;margin:6px 0 12px;color:var(--head)}
h3{font-size:26px;margin:0 0 6px;color:var(--head)}
p{margin:.55em 0;max-width:760px}
strong{color:var(--price);font-size:1.15em}
a{display:inline-block;margin:10px 14px 10px 0;padding:12px 24px;border-radius:var(--r);font-weight:700;text-decoration:none;background:var(--accent);color:#fff;font-size:19px}
a[href="specs.html"],a[href="returns.html"]{background:#fff;color:var(--accent);border:2px solid var(--accent);padding:10px 22px}
a[href="checkout.html"]{background:var(--ok)}
button{font-family:inherit;font-weight:700;font-size:19px;padding:12px 24px;border-radius:var(--r);border:0;background:var(--accent);color:#fff;margin:6px 10px 6px 0}
input[type=search],input[type=email],input[type=password]{font-family:inherit;font-size:19px;padding:11px 14px;border:2px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink);width:300px;max-width:100%;margin:6px 10px 6px 0}
label{margin-right:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:calc(var(--r) + 6px);padding:22px 26px;box-shadow:0 6px 20px rgba(20,40,60,.07);margin:16px 0}
.card p{margin:.5em 0}
.hero{display:flex;align-items:center;justify-content:space-between;gap:30px;background:#fff;border:1px solid var(--line);border-radius:calc(var(--r) + 8px);padding:30px 36px;box-shadow:0 8px 26px rgba(20,40,60,.08)}
.hero-text{flex:1}
.search{background:#fff;border:1px solid var(--line);border-radius:calc(var(--r) + 6px);padding:12px 20px;margin-top:22px;max-width:none}
.product{display:flex;gap:30px;align-items:center}
.product .info{flex:1}
.split{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:center;margin-top:8px}
.actions{margin-top:8px}
fieldset{border:2px solid var(--line);border-radius:calc(var(--r) + 4px);background:#fff;margin:16px 0;padding:10px 22px 14px}
legend{font-weight:700;color:var(--head);padding:0 8px}
input[type=radio]{width:20px;height:20px;accent-color:var(--accent);vertical-align:-3px;margin-left:6px}
.danger{border:2px solid #d9534f;background:#fff5f4}.danger h2{color:#b02a25;margin:0}
.tests{max-width:760px}
/* decorative laptop: shapes only, no text */
.art{position:relative;width:220px;height:150px;flex:none}
.art .scr{position:absolute;left:28px;top:0;width:164px;height:104px;border-radius:9px 9px 2px 2px;background:var(--screen);border:6px solid #1c2730}
.art .base{position:absolute;left:6px;top:104px;width:208px;height:13px;border-radius:0 0 16px 16px;background:linear-gradient(#d8e0e8,#98a6b3)}
.art.big{width:300px;height:210px}
.art.big .scr{left:38px;width:224px;height:146px;border-width:8px}
.art.big .base{left:8px;top:146px;width:284px;height:17px}
.art.small{width:150px;height:104px}
.art.small .scr{left:19px;width:112px;height:72px;border-width:5px}.art.small .base{left:4px;top:72px;width:142px;height:10px}
</style><aside>FICTIONAL PRACTICE STORE. No orders or real inventory.</aside><header class="brand"><div class="mark" aria-hidden="true"></div><h1>Summit Laptops</h1></header><main><section class="hero"><div class="hero-text"><h2>Laptops for work, study and play</h2><p>Explore new laptops without entering personal information.</p><a href="catalog.html">Browse laptops</a></div><div class="art" aria-hidden="true"><i class="scr"></i><i class="base"></i></div></section><p class="search"><label>Product search <input type="search" aria-label="Product search"></label></p></main></html>
